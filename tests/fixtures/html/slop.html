<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slop fixture</title>
<style>
:root{--ink:#16181d;--muted:#4b5261;--accent:#b8433a}
body{background:#f5ecd8;color:var(--ink);font-family:Georgia,serif;font-size:1rem;margin:0;padding:2rem}
h1{font-size:1.953125rem;font-weight:600;margin:0 0 1rem}
h2{font-size:1.25rem;margin:0 0 0.5rem}
.eyebrow{font-size:0.64rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--muted);margin:0 0 0.35rem}
.hero-title{background:linear-gradient(90deg,#1c7a4f,#c26a12);background-clip:text;-webkit-background-clip:text;color:transparent}
.card{border-left:3px solid var(--accent);padding:1rem;border-radius:32px;background:#ffffff}
.texture{background:repeating-linear-gradient(45deg,#e8ddc4 0 8px,#f5ecd8 8px 16px);height:6rem}
p{font-size:1rem;margin:0 0 1rem}
a{color:#7a2119}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<p class="eyebrow">Section one</p>
<h1 class="hero-title">A heading painted with a gradient</h1>

<p class="eyebrow">Section two</p>
<div class="card"><h2>A card with a coloured left stripe and a very soft radius</h2>
<p>Body copy that reads fine but sits on a warm off-white ground.</p></div>

<p class="eyebrow">Section three</p>
<div class="texture"></div>

<p class="eyebrow">Section four</p>
<p>A closing paragraph with <a href="#end">an internal link</a> and nothing else wrong.</p>
</body>
</html>
